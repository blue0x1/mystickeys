[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mystickeys"
dynamic = ["version"]
description = "RGB keyboard control for MSI laptops on Linux: colors, color waves, live effects and notification flash"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["msi", "rgb", "keyboard", "mysticlight", "backlight", "linux"]
classifiers = [
    "Environment :: X11 Applications",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]

[project.scripts]
mystickeys = "mystickeys.cli:run"

[tool.setuptools]
packages = ["mystickeys"]

[tool.setuptools.dynamic]
version = { attr = "mystickeys.__version__" }
