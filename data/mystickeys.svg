<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262b38"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
    <!-- four lighting zones, left to right -->
    <linearGradient id="rgb" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="216" y2="0">
      <stop offset="0" stop-color="#ff4d7a"/>
      <stop offset="0.33" stop-color="#ffb547"/>
      <stop offset="0.66" stop-color="#49d6a0"/>
      <stop offset="1" stop-color="#6ea8ff"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- underglow -->
  <rect x="44" y="92" width="168" height="96" rx="20" fill="url(#rgb)"
        opacity="0.55" filter="url(#glow)"/>

  <!-- keycaps: 3 rows, lit by the zone gradient -->
  <g fill="url(#rgb)">
    <rect x="40"  y="76"  width="40" height="34" rx="9"/>
    <rect x="88"  y="76"  width="40" height="34" rx="9"/>
    <rect x="136" y="76"  width="40" height="34" rx="9"/>
    <rect x="184" y="76"  width="32" height="34" rx="9"/>

    <rect x="40"  y="118" width="54" height="34" rx="9"/>
    <rect x="102" y="118" width="40" height="34" rx="9"/>
    <rect x="150" y="118" width="66" height="34" rx="9"/>

    <rect x="40"  y="160" width="32" height="34" rx="9"/>
    <rect x="80"  y="160" width="96" height="34" rx="9"/>
    <rect x="184" y="160" width="32" height="34" rx="9"/>
  </g>

  <!-- top highlight on every cap -->
  <g fill="url(#cap)">
    <rect x="40"  y="76"  width="40" height="17" rx="9"/>
    <rect x="88"  y="76"  width="40" height="17" rx="9"/>
    <rect x="136" y="76"  width="40" height="17" rx="9"/>
    <rect x="184" y="76"  width="32" height="17" rx="9"/>
    <rect x="40"  y="118" width="54" height="17" rx="9"/>
    <rect x="102" y="118" width="40" height="17" rx="9"/>
    <rect x="150" y="118" width="66" height="17" rx="9"/>
    <rect x="40"  y="160" width="32" height="17" rx="9"/>
    <rect x="80"  y="160" width="96" height="17" rx="9"/>
    <rect x="184" y="160" width="32" height="17" rx="9"/>
  </g>
</svg>
