name: Hardware report
description: Tell us how mystickeys works on your MSI laptop
title: "[Hardware] <your laptop model>"
labels: ["hardware report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Run this in a terminal (about 2 minutes, nothing is
        saved to your keyboard):
        ```
        ./bin/mystickeys report
        ```
        (use `sudo` in front if you haven't run `install.sh`), then paste the
        output below.
  - type: input
    id: model
    attributes:
      label: Laptop model
      placeholder: e.g. MSI GF63 Thin 11UC
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Output of `mystickeys report`
      description: Paste everything it printed (or the saved mystickeys-report.md).
      render: markdown
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Effects that look wrong, zones that don't match, etc.
